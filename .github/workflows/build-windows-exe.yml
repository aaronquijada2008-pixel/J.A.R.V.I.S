name: Build Windows EXE (PyInstaller)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          # Install the project without building native dependencies (avoid pyaudio compilation)
          python -m pip install -e . --no-deps

      - name: Build EXE with PyInstaller
        run: |
          # Run the build script from scripts/ which handles paths correctly
          python scripts/build_exe.py
      - name: Install NSIS (for creating installer)
        run: |
          choco install nsis -y || echo "choco install failed or choco not available"

      - name: Build installer with NSIS
        run: |
          if (Test-Path dist\jarvis.exe) {
            "C:\\Program Files (x86)\\NSIS\\makensis.exe" build\\installer.nsi
          } else {
            Write-Error "Expected dist\\jarvis.exe not found"
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-artifacts
          path: |
            dist/jarvis.exe
            dist/jarvis_installer.exe
